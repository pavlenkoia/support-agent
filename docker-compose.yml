services:
  app:
    build:
      context: .
      dockerfile: deploy/compose/app.Dockerfile
    env_file:
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/app.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${SUPPORT_AGENT_PROFILE_ROOT_HOST:-/home/tian/support-agent-profiles/parachute}:/data/profile:ro
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/logs:/app/logs
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: deploy/compose/worker.Dockerfile
    env_file:
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/app.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${SUPPORT_AGENT_PROFILE_ROOT_HOST:-/home/tian/support-agent-profiles/parachute}:/data/profile:ro
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/logs:/app/logs
    command: ["uv", "run", "python", "-m", "app.workers.main"]

  vk-worker:
    build:
      context: .
      dockerfile: deploy/compose/worker.Dockerfile
    env_file:
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/app.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${SUPPORT_AGENT_PROFILE_ROOT_HOST:-/home/tian/support-agent-profiles/parachute}:/data/profile:ro
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/logs:/app/logs
    command: ["uv", "run", "python", "-m", "app.workers.vk_main"]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: support_agent
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: support_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_agent -d support_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-support-agent}_postgres_data
