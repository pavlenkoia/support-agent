services:
  app:
    image: support-agent-app:${SUPPORT_AGENT_RELEASE_ID:-dev}
    build:
      context: .
      dockerfile: deploy/compose/app.Dockerfile
      args:
        SUPPORT_AGENT_RELEASE_ID: ${SUPPORT_AGENT_RELEASE_ID:-dev}
    restart: unless-stopped
    env_file:
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/app.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ${SUPPORT_AGENT_PROFILE_ROOT_HOST:-/home/tian/support-agent/deploy/profile}:/data/profile:ro
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/logs:/app/logs
    command: ["uv", "run", "--no-dev", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  viewer-web:
    image: support-agent-viewer-web:${SUPPORT_AGENT_RELEASE_ID:-dev}
    build:
      context: .
      dockerfile: deploy/compose/viewer-web.Dockerfile
      args:
        SUPPORT_AGENT_RELEASE_ID: ${SUPPORT_AGENT_RELEASE_ID:-dev}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "3002:3000"

  worker:
    image: support-agent-worker:${SUPPORT_AGENT_RELEASE_ID:-dev}
    build:
      context: .
      dockerfile: deploy/compose/worker.Dockerfile
      args:
        SUPPORT_AGENT_RELEASE_ID: ${SUPPORT_AGENT_RELEASE_ID:-dev}
    restart: unless-stopped
    env_file:
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/app.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${SUPPORT_AGENT_PROFILE_ROOT_HOST:-/home/tian/support-agent/deploy/profile}:/data/profile:ro
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/logs:/app/logs
    command: ["uv", "run", "--no-dev", "python", "-m", "app.workers.main"]

  vk-worker:
    image: support-agent-vk-worker:${SUPPORT_AGENT_RELEASE_ID:-dev}
    build:
      context: .
      dockerfile: deploy/compose/worker.Dockerfile
      args:
        SUPPORT_AGENT_RELEASE_ID: ${SUPPORT_AGENT_RELEASE_ID:-dev}
    restart: unless-stopped
    env_file:
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/app.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${SUPPORT_AGENT_PROFILE_ROOT_HOST:-/home/tian/support-agent/deploy/profile}:/data/profile:ro
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/logs:/app/logs
    command: ["uv", "run", "--no-dev", "python", "-m", "app.workers.vk_main"]

  viewer-push-worker:
    image: support-agent-viewer-push-worker:${SUPPORT_AGENT_RELEASE_ID:-dev}
    build:
      context: .
      dockerfile: deploy/compose/worker.Dockerfile
      args:
        SUPPORT_AGENT_RELEASE_ID: ${SUPPORT_AGENT_RELEASE_ID:-dev}
    restart: unless-stopped
    env_file:
      - ${SUPPORT_AGENT_RUNTIME_ROOT_HOST:-/home/tian/support-agent-runtime}/app.env
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "--no-dev", "python", "-m", "app.workers.viewer_push_main"]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_agent
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: support_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_agent -d support_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-support-agent}_postgres_data
