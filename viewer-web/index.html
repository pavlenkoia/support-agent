<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VK Viewer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      ;(() => {
        const storageKey = 'vk-dialog-viewer-theme'
        const savedTheme = window.localStorage.getItem(storageKey)
        const theme = savedTheme === 'dark' ? 'dark' : 'light'
        const palette =
          theme === 'dark'
            ? { background: '#020617', text: '#e2e8f0', themeColor: '#020617' }
            : { background: '#f8fafc', text: '#0f172a', themeColor: '#f8fafc' }

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.documentElement.style.backgroundColor = palette.background
        document.documentElement.style.color = palette.text

        const themeMeta = document.querySelector('meta[name="theme-color"]')
        if (themeMeta) {
          themeMeta.setAttribute('content', palette.themeColor)
        }
      })()
    </script>
    <title>VK Dialog Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
