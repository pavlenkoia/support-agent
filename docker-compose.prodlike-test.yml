services:
  app:
    build:
      context: .
      dockerfile: deploy/compose/app.Dockerfile
    restart: unless-stopped
    env_file:
      - /home/tian/support-agent-runtime-openrouter-test/app.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18000:8000"
    volumes:
      - /home/tian/support-agent-profiles/parachute:/data/profile:ro
      - /home/tian/support-agent-runtime-openrouter-test/logs:/app/logs
    command: ["uv", "run", "--no-dev", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  viewer-web:
    build:
      context: .
      dockerfile: deploy/compose/viewer-web.Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "13002:3000"

  worker:
    build:
      context: .
      dockerfile: deploy/compose/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - /home/tian/support-agent-runtime-openrouter-test/app.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /home/tian/support-agent-profiles/parachute:/data/profile:ro
      - /home/tian/support-agent-runtime-openrouter-test/logs:/app/logs
    command: ["uv", "run", "--no-dev", "python", "-m", "app.workers.main"]

  vk-worker:
    build:
      context: .
      dockerfile: deploy/compose/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - /home/tian/support-agent-runtime-openrouter-test/app.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /home/tian/support-agent-profiles/parachute:/data/profile:ro
      - /home/tian/support-agent-runtime-openrouter-test/logs:/app/logs
    command: ["uv", "run", "--no-dev", "python", "-m", "app.workers.vk_main"]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_agent
      POSTGRES_USER: support_agent
      POSTGRES_PASSWORD: support_agent
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_agent -d support_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: support-agent-or-test_postgres_data
